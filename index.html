		rel="stylesheet">
	<link href='https://unpkg.com/boxicons@2.1.1/css/boxicons.min.css' rel='stylesheet'>
	<meta name="description" content="Generate dominant color and color palette from any image you upload.">
	<title>Image to Palette</title>
</head>

<body>
	<div class="w-full min-h-screen overflow-x-hidden relative">
		<nav class="py-4 bg-white fixed inset-x-0 top-0 border-b border-gray-100 z-50">
			<div class="container px-8 mx-auto flex items-center relative">
				<a class="text-xl text-gray-800 font-black tracking-widest" href="#">IGP<span
						class="text-primary">.</span></a>
				<div class="flex justify-between items-center w-full">
					<div class="flex justify-between items-center w-full ml-6">
						<div></div>
						<div class="flex gap-1">
							<a href="https://github.com/bagussatoto/" target="_blank" rel="noopener noreferrer"
								aria-label="GitHub bagussatoto"
								class="hover:bg-gray-50 text-gray-400 h-10 w-10 rounded-full grid place-items-center transition-all duration-150">
								<i class='bx bxl-github text-xl'></i>
							</a>
						</div>
					</div>
				</div>
			</div>
		</nav>

		<main class="lg:min-h-screen flex justify-center items-center lg:mt-0 mt-28 relative">
			<div class="container px-8 grid lg:grid-cols-2 items-center gap-y-6 gap-x-10">
				<div class="space-y-4 lg:order-1 order-2 text-center lg:text-left">
					<h1 class="md:text-6xl sm:text-5xl text-4xl font-black text-gray-800">Get <span
							class="text-primary underline">Palettes</span> from Your <span
							class="text-primary underline">Photos</span>!</h1>
					<p class="text-gray-600 tracking-wide ">
						Get any color of any image you want for free! <br>
						Project in Bagus Budi Satoto
					</p>
					<a class="btn btn-primary gap-1 lg:inline-flex hidden" href="#try">Try Now!</a>
				</div>
				<img class="rounded-xl lg:order-2 order-1 mx-auto" src="./assets/img/owner.jpg" alt="Sample photo used for palette demo">
			</div>
		</main>

		<section id="try" class="my-20 scroll-mt-20">
			<div class="container px-8 mx-auto">
				<label class="btn btn-primary" for="image-upload">Change Image</label>
				<input type="file" id="image-upload" accept="image/*" class="absolute opacity-0 pointer-events-none">

				<div class="grid md:grid-cols-2 gap-10 mt-10">
					<img class="rounded-xl" id="image-preview" alt="Preview of the uploaded image">
					<div class="space-y-4">
						<h2 class="uppercase font-bold tracking-widest text-gray-400">Dominant Color</h2>
						<div class="flex gap-1 items-center" id="dominant-color">
							Wait...
						</div>
						<h2 class="uppercase font-bold tracking-widest text-gray-400">Palette</h2>
						<div class="grid lg:grid-cols-3 md:grid-cols-2 sm:grid-cols-3 grid-cols-2 gap-4" id="palette">
							Wait...
						</div>
					</div>
				</div>
			</div>
		</section>
	</div>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.6.0/color-thief.umd.js"></script>
	<script src="./dist/js/script.js"></script>
</body>

</html>
